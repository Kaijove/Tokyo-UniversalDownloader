[package]
name = "universal-downloader"
version = "1.0.0"
description = "A premium desktop media downloader"
edition = "2021"

[lib]
name = "universal_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile tuned for a distributable desktop binary: smaller and faster.
[profile.release]
opt-level = "s"        # optimise for size — smaller binary, no meaningful speed loss for an I/O-bound app
lto = true             # link-time optimisation across crates: smaller and faster
codegen-units = 1      # maximise optimisation (slower compile, better output)
strip = true           # drop debug symbols from the shipped binary
panic = "abort"        # no unwinding machinery — smaller binary; a panic aborts
incremental = false    # incremental is for dev; off gives a cleaner release build
