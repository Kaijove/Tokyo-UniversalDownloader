name: Release

# Triggered by a version tag (e.g. v1.0.0). Builds native installers for
# Windows, macOS (Intel + Apple Silicon) and Linux, then creates a GitHub
# Release with all bundles attached. Nothing is signed here — see the notes in
# MODULE-11 about the secrets to add when you want signed builds.

on:
  push:
    tags:
      - 'v*'

# One release build per tag; don't cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release (${{ matrix.platform }})
    permissions:
      # Needed for tauri-action to create the Release and upload assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon macs.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # Intel macs.
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Linux: deb, rpm and AppImage.
          - platform: ubuntu-22.04
            args: ''
          # Windows: MSI and NSIS.
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both targets for the universal split above; other
          # platforms build their host target only.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Signing secrets (optional; unset = unsigned build) -------------
          # Add these in repo Settings → Secrets to enable code signing.
          # Tauri updater signature:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarisation (macOS):
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # The tag that triggered the run names the release.
          tagName: ${{ github.ref_name }}
          releaseName: 'Universal Downloader ${{ github.ref_name }}'
          # GitHub auto-generates notes from merged PRs/commits since last tag.
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
